name: Optimize thumbnails

on:
  push:
    paths:
      - ".github/workflows/optimize-thumbs.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate lightweight thumbnails
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import io

          src_dir = Path("images/maps")
          out_dir = Path("images/thumbs")
          out_dir.mkdir(parents=True, exist_ok=True)

          max_side = 960
          target_bytes = 180 * 1024
          min_quality = 48
          max_quality = 78

          for src in sorted(src_dir.glob("map*.jpg")):
              with Image.open(src) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  w, h = im.size
                  scale = min(1.0, max_side / max(w, h))
                  if scale < 1:
                      im = im.resize(
                          (max(1, round(w * scale)), max(1, round(h * scale))),
                          Image.Resampling.LANCZOS
                      )

                  best = None
                  lo, hi = min_quality, max_quality
                  while lo <= hi:
                      q = (lo + hi) // 2
                      buf = io.BytesIO()
                      im.save(buf, "JPEG", quality=q, optimize=True, progressive=True, subsampling=2)
                      data = buf.getvalue()
                      if len(data) <= target_bytes:
                          best = (q, data)
                          lo = q + 1
                      else:
                          hi = q - 1

                  if best is None:
                      q = min_quality
                      buf = io.BytesIO()
                      im.save(buf, "JPEG", quality=q, optimize=True, progressive=True, subsampling=2)
                      best = (q, buf.getvalue())

                  out = out_dir / f"{src.stem}.jpg"
                  out.write_bytes(best[1])
                  print(f"{out}: {len(best[1]) / 1024:.0f} KB, quality={best[0]}, size={im.size}")

          for old in out_dir.glob("map*.webp"):
              old.unlink()
          PY

      - name: Commit thumbnails
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/thumbs
          if git diff --cached --quiet; then
            echo "No thumbnail changes to commit"
          else
            git commit -m "Optimize catalog thumbnails"
            git push
          fi
